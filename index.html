<style>
  :root{
    --ink:#0f0709;
    --gold-1:#f3d29a;
    --gold-2:#c9973f;
    --rose-1:#e8a3c0;
    --rose-2:#a63562;
    --cream:#faf3e6;
    --cream-dim:#d8c9be;
    --line:rgba(243,210,154,0.22);
    --glow:rgba(198,90,138,0.35);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}

  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    font-weight:400;
    line-height:1.6;
    max-width:560px;
    margin:0 auto;
    overflow-x:hidden;
    position:relative;
  }

  /* animated ambient glow behind everything */
  .ambient{
    position:fixed;
    inset:0;
    z-index:-1;
    max-width:560px;
    margin:0 auto;
    background:
      radial-gradient(50% 34% at 22% 6%, rgba(201,151,63,0.28), transparent 70%),
      radial-gradient(55% 30% at 82% 18%, rgba(166,53,98,0.30), transparent 70%),
      radial-gradient(60% 40% at 50% 78%, rgba(166,53,98,0.18), transparent 70%),
      linear-gradient(180deg, #170c0f 0%, var(--ink) 30%, #140a0c 100%);
    animation:drift 16s ease-in-out infinite alternate;
  }

  @keyframes drift{
    from{filter:hue-rotate(0deg) brightness(1);}
    to{filter:hue-rotate(6deg) brightness(1.08);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important; scroll-behavior:auto !important;}
  }

  h1,h2,h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    color:var(--cream);
    letter-spacing:0.01em;
  }

  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{padding:0 24px;}

  /* reveal-on-scroll */
  .reveal{
    opacity:0;
    transform:translateY(22px);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.in{opacity:1; transform:translateY(0);}

  /* sparkle decorations */
  .sparkle{
    position:absolute;
    color:var(--gold-1);
    font-size:14px;
    opacity:0.7;
    animation:twinkle 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(0.8) rotate(0deg);}
    50%{opacity:0.9; transform:scale(1.15) rotate(12deg);}
  }

  /* ---------- Hero ---------- */

  .hero{
    padding:54px 24px 44px;
    text-align:center;
    position:relative;
  }

  .hero::after{
    content:"";
    position:absolute;
    left:50%; bottom:0;
    transform:translateX(-50%);
    width:72%; height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }

  .logo-ring{
    width:176px; height:176px;
    margin:0 auto 30px;
    border-radius:50%;
    padding:6px;
    position:relative;
    background:conic-gradient(from 0deg, var(--gold-2), var(--rose-1), var(--gold-1), var(--rose-2), var(--gold-2));
    animation:spin-in 1s ease-out, rotate-ring 10s linear infinite;
  }

  @keyframes spin-in{
    from{opacity:0; transform:scale(.8) rotate(-10deg);}
    to{opacity:1; transform:scale(1) rotate(0);}
  }
  @keyframes rotate-ring{
    from{filter:hue-rotate(0deg);}
    to{filter:hue-rotate(360deg);}
  }

  .logo-ring .halo{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(closest-side, var(--glow), transparent 75%);
    animation:pulse 3s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes pulse{
    0%,100%{opacity:0.5; transform:scale(0.96);}
    50%{opacity:0.95; transform:scale(1.08);}
  }

  .logo-ring img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--ink);
    display:block;
  }

  .kicker{
    font-size:12.5px;
    color:var(--rose-1);
    letter-spacing:0.16em;
    margin-bottom:12px;
    opacity:0.9;
  }

  .hero h1{
    font-size:42px;
    line-height:1.06;
    margin-bottom:10px;
    background:linear-gradient(100deg, var(--gold-1) 10%, var(--cream) 40%, var(--rose-1) 75%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19.5px;
    color:var(--gold-1);
    margin-bottom:20px;
  }

  .hero p.lead{
    font-size:15.5px;
    color:var(--cream-dim);
    max-width:340px;
    margin:0 auto 30px;
  }

  .cta{
    display:inline-block;
    width:100%;
    padding:17px 20px;
    background:linear-gradient(120deg, var(--gold-1), var(--gold-2) 55%, var(--rose-2));
    background-size:180% 180%;
    color:#241005;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.02em;
    border-radius:12px;
    box-shadow:0 14px 34px -12px var(--glow), 0 0 0 1px rgba(255,255,255,0.05) inset;
    text-align:center;
    transition:transform 0.25s ease, box-shadow 0.25s ease, background-position 0.6s ease;
    position:relative;
  }

  .cta:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 44px -12px var(--glow), 0 0 0 1px rgba(255,255,255,0.08) inset;
    background-position:100% 0%;
  }

  .cta:active{transform:translateY(0);}

  .cta-note{
    margin-top:13px;
    font-size:12.5px;
    color:var(--cream-dim);
    opacity:0.75;
  }

  /* ---------- Section shell ---------- */

  section{padding:46px 24px; position:relative;}

  .section-title{
    font-size:28px;
    margin-bottom:6px;
  }

  .section-sub{
    font-size:14.5px;
    color:var(--cream-dim);
    margin-bottom:30px;
    max-width:380px;
  }

  /* ---------- About ---------- */

  .about{border-top:1px solid var(--line);}

  .about p{
    font-size:15px;
    color:var(--cream-dim);
    margin-bottom:14px;
  }
  .about p:last-child{margin-bottom:0;}
  .about strong{color:var(--gold-1); font-weight:500;}

  /* ---------- Feature cards ---------- */

  .features{border-top:1px solid var(--line);}

  .feature{
    display:flex;
    gap:16px;
    align-items:flex-start;
    padding:22px;
    margin-bottom:14px;
    border-radius:16px;
    background:linear-gradient(160deg, rgba(243,210,154,0.06), rgba(166,53,98,0.05));
    border:1px solid var(--line);
    transition:transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .feature:last-child{margin-bottom:0;}

  .feature:hover{
    transform:translateY(-4px);
    border-color:rgba(243,210,154,0.55);
    box-shadow:0 16px 30px -16px var(--glow);
  }

  .feature-icon{
    flex:0 0 auto;
    width:48px; height:48px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(243,210,154,0.1);
    border:1px solid var(--line);
    transition:background 0.3s ease, transform 0.3s ease;
  }

  .feature:hover .feature-icon{
    background:rgba(243,210,154,0.22);
    transform:scale(1.08) rotate(-4deg);
  }

  .feature-icon svg{width:21px; height:21px; stroke:var(--gold-1);}

  .feature h3{
    font-size:19.5px;
    margin-bottom:4px;
    font-weight:600;
  }

  .feature p{
    font-size:14px;
    color:var(--cream-dim);
  }

  /* ---------- Trust strip ---------- */

  .trust{
    border-top:1px solid var(--line);
    text-align:center;
  }

  .trust-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin-top:28px;
  }

  .trust-item{
    padding:18px 8px;
    border-radius:14px;
    background:rgba(243,210,154,0.05);
    border:1px solid var(--line);
    transition:transform 0.3s ease, background 0.3s ease;
  }

  .trust-item:hover{
    transform:translateY(-3px);
    background:rgba(243,210,154,0.1);
  }

  .trust-item .num{
    font-family:'Cormorant Garamond', serif;
    font-size:29px;
    background:linear-gradient(100deg, var(--gold-1), var(--rose-1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
  }

  .trust-item .label{
    font-size:11.5px;
    color:var(--cream-dim);
    margin-top:3px;
  }

  .quote{
    margin-top:32px;
    padding:22px;
    border:1px solid var(--line);
    border-radius:16px;
    background:linear-gradient(160deg, rgba(166,53,98,0.14), rgba(243,210,154,0.05));
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:18px;
    color:var(--cream);
    text-align:left;
  }

  .quote span{
    display:block;
    margin-top:10px;
    font-family:'Jost', sans-serif;
    font-style:normal;
    font-size:12.5px;
    color:var(--rose-1);
  }

  /* ---------- Final CTA ---------- */

  .final{
    border-top:1px solid var(--line);
    text-align:center;
  }

  .final h2{font-size:27px; margin-bottom:10px;}

  .final p{
    font-size:14.5px;
    color:var(--cream-dim);
    margin-bottom:26px;
  }

  /* ---------- Footer ---------- */

  footer{
    padding:30px 24px 42px;
    text-align:center;
    border-top:1px solid var(--line);
  }

  footer .brand{
    font-family:'Cormorant Garamond', serif;
    font-size:18px;
    color:var(--gold-1);
    margin-bottom:6px;
  }

  footer p{
    font-size:12px;
    color:var(--cream-dim);
    opacity:0.7;
  }
</style>
</head>

  @keyframes pulse{
    0%,100%{opacity:0.5; transform:scale(0.96);}
    50%{opacity:0.95; transform:scale(1.08);}
  }

  .logo-ring img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--ink);
    display:block;
  }

  .kicker{
    font-size:12.5px;
    color:var(--rose-1);
    letter-spacing:0.16em;
    margin-bottom:12px;
    opacity:0.9;
  }

  .hero h1{
    font-size:42px;
    line-height:1.06;
    margin-bottom:10px;
    background:linear-gradient(100deg, var(--gold-1) 10%, var(--cream) 40%, var(--rose-1) 75%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19.5px;
    color:var(--gold-1);
    margin-bottom:20px;
  }

  .hero p.lead{
    font-size:15.5px;
    color:var(--cream-dim);
    max-width:340px;
    margin:0 auto 30px;
  }

  .cta{
    display:inline-block;
    width:100%;
    padding:17px 20px;
    background:linear-gradient(120deg, var(--gold-1), var(--gold-2) 55%, var(--rose-2));
    background-size:180% 180%;
    color:#241005;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.02em;
    border-radius:12px;
    box-shadow:0 14px 34px -12px var(--glow), 0 0 0 1px rgba(255,255,255,0.05) inset;
    text-align:center;
    transition:transform 0.25s ease, box-shadow 0.25s ease, background-position 0.6s ease;
    position:relative;
  }

  .cta:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 44px -12px var(--glow), 0 0 0 1px rgba(255,255,255,0.08) inset;
    background-position:100% 0%;
  }

  .cta:active{transform:translateY(0);}

  .cta-note{
    margin-top:13px;
    font-size:12.5px;
    color:var(--cream-dim);
    opacity:0.75;
  }

  /* ---------- Section shell ---------- */

  section{padding:46px 24px; position:relative;}

  .section-title{
    font-size:28px;
    margin-bottom:6px;
  }

  .section-sub{
    font-size:14.5px;
    color:var(--cream-dim);
    margin-bottom:30px;
    max-width:380px;
  }

  /* ---------- About ---------- */

  .about{border-top:1px solid var(--line);}

  .about p{
    font-size:15px;
    color:var(--cream-dim);
    margin-bottom:14px;
  }
  .about p:last-child{margin-bottom:0;}
  .about strong{color:var(--gold-1); font-weight:500;}

  /* ---------- Feature cards ---------- */

  .features{border-top:1px solid var(--line);}

  .feature{
    display:flex;
    gap:16px;
    align-items:flex-start;
    padding:22px;
    margin-bottom:14px;
    border-radius:16px;
    background:linear-gradient(160deg, rgba(243,210,154,0.06), rgba(166,53,98,0.05));
    border:1px solid var(--line);
    transition:transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .feature:last-child{margin-bottom:0;}

  .feature:hover{
    transform:translateY(-4px);
    border-color:rgba(243,210,154,0.55);
    box-shadow:0 16px 30px -16px var(--glow);
  }

  .feature-icon{
    flex:0 0 auto;
    width:48px; height:48px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(243,210,154,0.1);
    border:1px solid var(--line);
    transition:background 0.3s ease, transform 0.3s ease;
  }

  .feature:hover .feature-icon{
    background:rgba(243,210,154,0.22);
    transform:scale(1.08) rotate(-4deg);
  }

  .feature-icon svg{width:21px; height:21px; stroke:var(--gold-1);}

  .feature h3{
    font-size:19.5px;
    margin-bottom:4px;
    font-weight:600;
  }

  .feature p{
    font-size:14px;
    color:var(--cream-dim);
  }

  /* ---------- Trust strip ---------- */

  .trust{
    border-top:1px solid var(--line);
    text-align:center;
  }

  .trust-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin-top:28px;
  }

  .trust-item{
    padding:18px 8px;
    border-radius:14px;
    background:rgba(243,210,154,0.05);
    border:1px solid var(--line);
    transition:transform 0.3s ease, background 0.3s ease;
  }

  .trust-item:hover{
    transform:translateY(-3px);
    background:rgba(243,210,154,0.1);
  }

  .trust-item .num{
    font-family:'Cormorant Garamond', serif;
    font-size:29px;
    background:linear-gradient(100deg, var(--gold-1), var(--rose-1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
  }

  .trust-item .label{
    font-size:11.5px;
    color:var(--cream-dim);
    margin-top:3px;
  }

  .quote{
    margin-top:32px;
    padding:22px;
    border:1px solid var(--line);
    border-radius:16px;
    background:linear-gradient(160deg, rgba(166,53,98,0.14), rgba(243,210,154,0.05));
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:18px;
    color:var(--cream);
    text-align:left;
  }

  .quote span{
    display:block;
    margin-top:10px;
    font-family:'Jost', sans-serif;
    font-style:normal;
    font-size:12.5px;
    color:var(--rose-1);
  }

  /* ---------- Final CTA ---------- */

  .final{
    border-top:1px solid var(--line);
    text-align:center;
  }

  .final h2{font-size:27px; margin-bottom:10px;}

  .final p{
    font-size:14.5px;
    color:var(--cream-dim);
    margin-bottom:26px;
  }

  /* ---------- Footer ---------- */

  footer{
    padding:30px 24px 42px;
    text-align:center;
    border-top:1px solid var(--line);
  }

  footer .brand{
    font-family:'Cormorant Garamond', serif;
    font-size:18px;
    color:var(--gold-1);
    margin-bottom:6px;
  }

  footer p{
    font-size:12px;
    color:var(--cream-dim);
    opacity:0.7;
  }
</style>
</head>
